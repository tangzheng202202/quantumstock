services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: quantumstock
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum -d quantumstock"]
      interval: 10s
      retries: 5

  # Redis for caching and real-time data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  # Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://quantum:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/quantumstock?schema=public
      REDIS_URL: redis://redis:6379
      PYTHON_ENGINE_URL: http://python-engine:8000
      # Set these in .env.local or via docker-compose override
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Clerk (auth)
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Python quant engine (optional)
  python-engine:
    build:
      context: ./python-engine
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    profiles:
      - full

volumes:
  pgdata:
  redisdata:
